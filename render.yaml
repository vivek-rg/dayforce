# Render Blueprint on the free plan. Free instances have no persistent disk, so the SQLite
# database resets whenever the service sleeps or redeploys; scripts/serve.py re-seeds it on boot.
# For data that survives restarts, switch to plan: starter and attach a disk at /data with
# DATABASE_PATH=/data/dayone.db.
services:
  - type: web
    name: dayforce
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_PATH
        value: .runtime/dayone.db
      - key: LLM_PROVIDER
        value: hosted
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: WORKER_ENABLED
        value: "1"
      # Secrets: Render asks for these when the Blueprint is created. Never commit them.
      - key: LLM_API_KEY
        sync: false
      - key: DEMO_PASSWORD
        sync: false
