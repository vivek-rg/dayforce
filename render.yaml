# Disposable synthetic demo on the free plan; no persistent disk is configured.
# SQLite and uploaded files may be lost on instance replacement/redeploy.
# scripts/serve.py seeds only an empty installation; it does not restore lost progress.
# Keep durable local backups. Hosted retention requires an owner-approved storage plan
# covering both the database and uploads; do not enable paid services automatically.
services:
  - type: web
    name: dayforce
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_PATH
        value: .runtime/dayone.db
      # Hosted AI requires LLM_API_KEY to be set privately in Render.
      - key: LLM_PROVIDER
        value: hosted
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: WORKER_ENABLED
        value: "1"
      - key: LLM_API_KEY
        sync: false
      # A fresh seed needs a private demo password.
      - key: DEMO_PASSWORD
        sync: false
